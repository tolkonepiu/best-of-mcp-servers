name: maintain-projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # First day of each month at 03:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  maintain-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: install-cleanup-dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: remove-hidden-projects
        run: python .github/scripts/maintain_projects.py cleanup
      - name: update-repository-identities
        run: python .github/scripts/maintain_projects.py update-github-ids
      - name: remove-duplicate-names
        run: python .github/scripts/maintain_projects.py remove-duplicate-names
      - name: create-app-token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: create-maintenance-pr
        id: maintenance-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          branch: automation/maintain-projects
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: projects.yaml
          commit-message: Maintain projects
          title: Maintain projects
      - name: enable-auto-merge
        if: >-
          steps.maintenance-pr.outputs.pull-request-number != '' &&
          (steps.maintenance-pr.outputs.pull-request-operation == 'created' ||
          steps.maintenance-pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.maintenance-pr.outputs.pull-request-number }}
          PR_SHA: ${{ steps.maintenance-pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_SHA"
