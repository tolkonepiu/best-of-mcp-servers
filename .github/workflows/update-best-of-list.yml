# Based on https://github.com/best-of-lists/best-of-update-action/blob/v0.8.5/workflows/update-best-of-list.yml
name: update-best-of-list

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for this update"
        required: false
  schedule:
    - cron: "0 0 * * 3" # Runs at 00:00 on Wednesday UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  update-best-of-list:
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs != null  &&  github.event.inputs.version != null }}
        name: set-version-from-input
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
      - if: ${{ ! (env.VERSION != null && env.VERSION != '') }}
        name: set-version-via-date
        run: echo "VERSION=$(date '+%Y.%m.%d')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false
      - name: check-version-tag
        shell: bash
        run: |
          git fetch --tags --force
          git show-ref --tags --verify --quiet -- "refs/tags/$VERSION" && echo "VERSION=$(date '+%Y.%m.%d-%H.%M')" >> "$GITHUB_ENV" || exit 0
      - name: update-best-of-list
        uses: best-of-lists/best-of-update-action@ee4e7b88df0e3538d496eab82fe5b4e613c999ef # v0.8.5
        with:
          libraries_key: ${{ secrets.LIBRARIES_KEY }}
          github_key: ${{ secrets.GH_API_TOKEN }}
      - name: create-app-token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: create-update-pr
        id: update-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          branch: automation/update-best-of-list
          base: ${{ env.DEFAULT_BRANCH }}
          delete-branch: true
          add-paths: |
            README.md
            latest-changes.md
            history/
          commit-message: Update best-of list for version ${{ env.VERSION }}
          title: Update best-of list for version ${{ env.VERSION }}
      - name: enable-auto-merge
        if: >-
          steps.update-pr.outputs.pull-request-number != '' &&
          (steps.update-pr.outputs.pull-request-operation == 'created' ||
           steps.update-pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.update-pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.update-pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
