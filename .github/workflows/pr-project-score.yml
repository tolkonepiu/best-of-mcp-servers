name: PR project score

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  pr-project-score:
    name: PR project score
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install scoring dependencies
        run: python3 -m pip install --requirement .github/scripts/project_score/requirements.txt

      - name: Prepare changed projects
        id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          snapshots=$(mktemp -d "$RUNNER_TEMP/pr-project-score.XXXXXX")
          workdir=$(mktemp -d .pr-project-score.XXXXXX)
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
          git show "$merge_base:projects.yaml" > "$snapshots/base.yaml"
          git show "$HEAD_SHA:projects.yaml" > "$snapshots/head.yaml"
          python3 .github/scripts/project_score/project_score.py prepare "$snapshots/base.yaml" "$snapshots/head.yaml" "$workdir"

      - name: Score changed projects
        id: score
        if: steps.prepare.outputs.count != '0' && steps.prepare.outputs.count != ''
        continue-on-error: true
        uses: best-of-lists/best-of-update-action@ee4e7b88df0e3538d496eab82fe5b4e613c999ef # v0.8.5
        with:
          github_key: ${{ secrets.GH_API_TOKEN }}
          libraries_key: ''
          projects_file: ${{ steps.prepare.outputs.workdir }}/projects.yaml

      - name: Verify project scores
        id: verify
        if: always() && steps.prepare.outcome == 'success' && steps.prepare.outputs.count != '0' && steps.prepare.outputs.count != ''
        env:
          MIN_PROJECTRANK: ${{ vars.MIN_PROJECTRANK || '15' }}
          GENERATOR_OUTCOME: ${{ steps.score.outcome }}
          WORKDIR: ${{ steps.prepare.outputs.workdir }}
        run: python3 .github/scripts/project_score/project_score.py verify "$WORKDIR" --minimum "$MIN_PROJECTRANK" --generator-outcome "$GENERATOR_OUTCOME"

      - name: Publish project score report
        if: always() && steps.prepare.outcome == 'success' && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          WORKDIR: ${{ steps.prepare.outputs.workdir }}
        run: |
          if [ -f "$WORKDIR/report.md" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$WORKDIR/report.md"
          fi
