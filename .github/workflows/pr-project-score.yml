name: PR project score

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  pr-project-score:
    name: PR project score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install scoring dependencies
        run: python3 -m pip install --requirement .github/requirements-pr-project-score.txt

      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v

      - name: Prepare changed projects
        id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          snapshots=$(mktemp -d "$RUNNER_TEMP/pr-project-score.XXXXXX")
          workdir=$(mktemp -d .pr-project-score.XXXXXX)
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
          git show "$merge_base:projects.yaml" > "$snapshots/base.yaml"
          git show "$HEAD_SHA:projects.yaml" > "$snapshots/head.yaml"
          python3 .github/scripts/pr_project_score.py prepare "$snapshots/base.yaml" "$snapshots/head.yaml" "$workdir"

      - name: Score changed projects
        id: score
        if: steps.prepare.outputs.count != '0' && steps.prepare.outputs.count != ''
        continue-on-error: true
        uses: best-of-lists/best-of-update-action@ee4e7b88df0e3538d496eab82fe5b4e613c999ef # v0.8.5
        with:
          github_key: ${{ secrets.GITHUB_TOKEN }}
          libraries_key: ''
          projects_file: ${{ steps.prepare.outputs.workdir }}/projects.yaml

      - name: Verify project scores
        if: always() && steps.prepare.outcome == 'success' && steps.prepare.outputs.count != '0' && steps.prepare.outputs.count != ''
        env:
          MIN_PROJECTRANK: ${{ vars.MIN_PROJECTRANK || '10' }}
          GENERATOR_OUTCOME: ${{ steps.score.outcome }}
          WORKDIR: ${{ steps.prepare.outputs.workdir }}
        run: python3 .github/scripts/pr_project_score.py verify "$WORKDIR" --minimum "$MIN_PROJECTRANK" --generator-outcome "$GENERATOR_OUTCOME"
